# Model roster. A run is identified by one of these names, and its manifest records the
# entry verbatim - edit an entry and old runs under that name are no longer comparable,
# so add a new name instead.
#
# Quote strings: YAML reads bare null / no / on as non-strings.
#
# Tiers: one flagship-tier and one low-cost model per vendor, matched by role rather than
# exact price (Opus 5 $5/$25, GPT-5.6 Sol $4/$20, Gemini 3.1 Pro $2/$12 per MTok in/out;
# Haiku 4.5 $1/$5, GPT-5.6 Luna $0.20/$1.20, Gemini 3.8 Flash $0.75/$3.75).
# Sonnet 5 is kept as an optional middle tier.
#
# Reasoning: every model that has a reasoning control runs at "high". Vendor defaults
# differ (Opus 5 and Gemini 3.1 Pro default to high, GPT-5.6 and Gemini 3.8 Flash to
# medium), so "defaults" would compare different amounts of thinking. Haiku 4.5 has no
# effort control and does not think by default; it runs as-is. Gemini models cannot
# turn thinking off.
#
# Model IDs are pinned versions, not "-latest" aliases, and the runner checks the model
# each API reports on every response. No refusal fallbacks: a score from a fallback model
# measures nothing.
#
# Credentials: ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY. Local models need a running
# server (`ollama serve`) instead.

models:
  # --- Anthropic ---
  "opus-5":
    provider: "anthropic"
    model: "claude-opus-5"
    max_tokens: 16000
    effort: "high"

  "sonnet-5":
    provider: "anthropic"
    model: "claude-sonnet-5"
    max_tokens: 16000
    effort: "high"

  "haiku-4.5":
    provider: "anthropic"
    model: "claude-haiku-4-5"
    max_tokens: 16000

  # --- OpenAI ---
  "gpt-5.6-sol":
    provider: "openai"
    model: "gpt-5.6-sol"
    max_tokens: 16000
    reasoning_effort: "high"

  "gpt-5.6-luna":
    provider: "openai"
    model: "gpt-5.6-luna"
    max_tokens: 16000
    reasoning_effort: "high"

  # --- Google ---
  "gemini-3.1-pro":
    provider: "gemini"
    model: "gemini-3.1-pro-preview"  # preview: can change or be retired on 2 weeks' notice
    max_tokens: 16000
    thinking_level: "high"

  "gemini-3.8-flash":
    provider: "gemini"
    model: "gemini-3.8-flash"
    max_tokens: 16000
    thinking_level: "high"

  # --- Open-weight (local, via Ollama's OpenAI-compatible endpoint) ---
  # `digest` pins the weights: a tag can be re-pulled to different ones. Q4_K_M, 8.2B params.
  "qwen3-8b":
    provider: "local"
    model: "qwen3:8b"
    digest: "500a1f067a9f"
    max_tokens: 16000
    reasoning_effort: "high"
    workers: 1  # one request at a time, so latency isn't queue wait

  # Harness self-checks - no API calls. See `python -m harness selfcheck`.
  "oracle":
    provider: "oracle"

  "null-baseline":
    provider: "null"
